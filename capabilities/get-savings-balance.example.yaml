# Draft schema example. The generated artifact comes from a real discovery trace.
schema_version: "1.0"
id: legacybank.get_savings_balance
version: 1.0.0
name: Get Savings Balance
description: Return a fictional member's current savings balance.
approval: draft
application:
  vendor_family: LegacyBank
  app_family: Admin Simulator
  compatible_versions:
    - "7.x"
  variant: training
  entry_url: http://localhost:4000
  fingerprint_hints:
    title: LegacyBank Admin Simulator
inputs:
  member_id:
    type: string
    description: Fictional Member ID supplied at invocation time.
    required: true
    sensitive: false
outputs:
  balance:
    type: number
    description: Current savings balance in dollars.
    nullable: false
    sensitive: false
  currency:
    type: string
    description: ISO currency code.
    nullable: false
    sensitive: false
risk: SAFE
policy:
  allowed_domains:
    - localhost
  allowed_route_patterns:
    - ^/$
    - ^/members/.*$
  allowed_actions:
    - navigate
    - fill
    - click
    - extract
    - assert
  blocked_target_patterns:
    - open new sub-account
    - continue to review
  risky_action_behavior: BLOCK
steps:
  - id: open_member_search
    description: Open the training member search page.
    action:
      action: navigate
      url: http://localhost:4000
    postconditions:
      - kind: element_visible
        target:
          id: member_id_field
          description: Member ID input
          strategies:
            - kind: label
              value: Member ID
  - id: enter_member_id
    description: Enter the caller's fictional member identifier.
    action:
      action: fill
      target:
        id: member_id_field
        description: Member ID input
        strategies:
          - kind: label
            value: Member ID
          - kind: name
            value: member_id
      value:
        from_input: member_id
  - id: search_member
    description: Submit the search form.
    action:
      action: click
      target:
        id: search_button
        description: Search button
        strategies:
          - kind: role
            role: button
            name: Search
          - kind: css
            value: button[type="submit"]
    recovery:
      max_attempts: 2
      backoff_ms: 500
      on_failure: fail
  - id: read_balance
    description: Read the savings balance inside the accounts frame.
    action:
      action: extract
      target:
        id: savings_balance
        description: Savings current balance cell
        frame: Member accounts
        strategies:
          - kind: table_cell
            row_text: Savings
            column_header: Current Balance
      output: balance
      transform: currency
  - id: read_currency
    description: Read the savings account currency.
    action:
      action: extract
      target:
        id: savings_currency
        description: Savings currency cell
        frame: Member accounts
        strategies:
          - kind: table_cell
            row_text: Savings
            column_header: Currency
      output: currency
      transform: text
success:
  - kind: output
    output: balance
  - kind: output
    output: currency
terminal_conditions:
  - code: MEMBER_NOT_FOUND
    status: BUSINESS_OUTCOME
    description: Search produced a known no-member result.
    checkpoint:
      kind: text
      target:
        id: member_not_found_alert
        description: Member not found alert
        strategies:
          - kind: role
            role: alert
      operator: matches
      expected: (?:member not found|no member was found)
      timeout_ms: 300
  - code: PERMISSION_DENIED
    status: HARD_FAILURE
    description: Operator profile cannot access this member.
    checkpoint:
      kind: text
      target:
        id: permission_denied_alert
        description: Permission denied alert
        strategies:
          - kind: role
            role: alert
      operator: matches
      expected: permission.denied
      timeout_ms: 300
  - code: APP_ERROR
    status: HARD_FAILURE
    description: Legacy host application error.
    checkpoint:
      kind: text
      target:
        id: application_error_alert
        description: Application error alert
        strategies:
          - kind: role
            role: alert
      operator: matches
      expected: (?:app.error|application error)
      timeout_ms: 300
tenant_overrides: []
metadata:
  created_at: 2026-09-15T00:00:00.000Z
  created_by: schema-example
  description_notes:
    - Illustrates the schema; the generated artifact is compiled from discovery.
  contains_secrets: false
